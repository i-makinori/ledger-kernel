# /etc/nginx/conf.d/ledger_server.conf
#
# Ledger Kernel web UI behind nginx. Replace ledger.rndiis.com with the
# subdomain you use (and add its DNS record first). Then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ledger.rndiis.com     # adds the 443/ssl lines
#
# Files in conf.d are included inside nginx's http { } block, so the
# limit_req_zone below is valid here.

# At most 20 proof checks per minute per client address (bursts of 5).
limit_req_zone $binary_remote_addr zone=ledger_check:10m rate=20r/m;

server {
    listen 80;
    server_name ledger.rndiis.com;

    # Proof checking: rate-limited, small bodies, bounded time.
    location = /api/check {
        limit_req zone=ledger_check burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_read_timeout 30s;

        proxy_pass http://127.0.0.1:35938;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browsing (read-only).
    location / {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:35938;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
